pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = uri('https://jitpack.io') }
    }
}

rootProject.name = 'BeautySDK'

include ':app'
include ':core:core_base'
include ':core:core_utils'
include ':feature:feature_app'
include ':feature:feature_res'

include ':core:lib_beauty'
include ':core:lib_beauty_mediapipe'
include ':core:lib_camera'
include ':core:lib_beauty_gpupixel'

include ':core:lib_beauty_resources'
