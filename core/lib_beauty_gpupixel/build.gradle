plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace = 'com.beautysdk.gpupixel'
    compileSdk = libs.versions.compileSdk.get().toInteger()
    ndkVersion = libs.versions.beauty.ndk.get()
    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()
        consumerProguardFiles 'consumer-rules.pro'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' }
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version = libs.versions.beauty.cmake.get()
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
kotlin { jvmToolchain(17) }
dependencies { api project(':core:lib_beauty'); testImplementation libs.junit }
apply from: rootProject.file('gradle/beauty-publishing.gradle')
